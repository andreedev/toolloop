<div class="flex flex-row gap-2" (mouseleave)="onLeave()">
    @for (star of stars; track star) {
        <fa-icon
            [icon]="isActive(star) ? faStarSolid : faStarRegular"
            class="text-2xl cursor-pointer transition-colors duration-600"
            [class.text-yellow-400]="isActive(star)"
            [class.text-gray-300]="!isActive(star)"
            (mouseenter)="onHover(star)"
            (click)="onClick(star)"
        ></fa-icon>
    }
</div>
