<p-blockui [blocked]="generalDataService.loading()" baseZIndex="1">
    @if (generalDataService.loading()) {
        <p-progress-spinner class="flex self-center my-spinner"/>
    }
</p-blockui>

<p-toast 
    position="top-right" 
    class="toast-responsive-fix"
    [preventOpenDuplicates]="true"
    [breakpoints]="{ '640px': { width: '100%', right: '0', left: '0' } }">
</p-toast>
<router-outlet />
