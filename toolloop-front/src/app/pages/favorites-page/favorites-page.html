<div class="bg-gray-50 w-full min-h-screen">
    <div class="px-4 py-8 max-w-5xl mx-auto flex flex-col gap-2">
        <p class="text-2xl font-bold">Favoritos</p>
        <p class="text-neutral-500">4 herramientas guardadas</p>
        <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4 px-2 w-full">
            <div class="flex flex-col shadow-sm rounded-2xl relative gap-2 bg-white">
                <img src="assets/images/tool1.png" alt="Tool 1" class="w-60 h-48 object-cover rounded-t-2xl">
                <p class="absolute text-xs bg-lime-400 text-white px-2 py-1 rounded-2xl top-4 left-4">Disponible</p>
                <fa-icon [icon]="faHeart" class="absolute text-red-500 top-4 right-4 bg-white rounded-full p-1"></fa-icon>
                <p class="px-4 text-lg font-bold">Herramienta 1</p>
                <div class="flex px-4 text-xs">
                    <p class="px-1 rounded-2xl bg-teal-100 text-teal-500">Carpintería</p>
                </div>
                <div class="flex flex-row gap-2 px-4">
                    <div class="flex flex-row items-center gap-1 text-sm">
                        <fa-icon [icon]="faStar" class="text-yellow-400"></fa-icon>
                        <p class="text-sm text-neutral-500">4.5</p>
                    </div>
                    <p class="text-neutral-500">·</p>
                    <div class="flex flex-row items-center gap-1 text-sm">
                        <fa-icon [icon]="faLocationDot" class="text-neutral-500"></fa-icon>
                        <p class="text-sm text-neutral-500">320m</p>
                    </div>
                </div>
                <div class="px-4 pb-4 flex flex-col gap-1 lg:flex-row items-center justify-between">
                    <p class="font-bold text-green-700">5€/día</p>
                    <button class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-blue-600" [routerLink]>Reservar</button>
                </div>
            </div>

        </div>
    </div>
</div>
