<div class="bg-gray-50 width-full">
    <div class="max-w-5xl mx-auto py-8 px-4">
        <div class="flex flex-row justify-between items-center">
            <div class="flex flex-row gap-3">
                <img src="path/to/image.jpg" alt="User Image" class="w-15 h-15 rounded-2xl object-cover border">
                <div class="flex flex-col gap-2">
                    <span class="text-neutral-500">Conversación sobre:</span>
                    <span class="text-lg font-bold">Taladro Percutor Bosch 800W</span>
                </div>
            </div>
            <fa-icon [icon]="faArrowRight" class="text-xl text-neutral-400 self-center hover:text-black" routerLink="/app/tool/4"></fa-icon>
        </div>
        <div class="mt-5 text-center flex flex-col gap-4">
            <div>
                <span class="text-sm text-neutral-400 px-2 py-1 bg-white rounded-2xl">10:30</span>
            </div>
            <div class="text-lg flex flex-col gap-2 justify-start items-start">
                <span class="px-5 border border-neutral-300 py-1 bg-white rounded-2xl">Hola! Me interesa el taladro. ¿Está disponible del 8 al 10 de abril?</span>
            </div>
            <div>
                <span class="text-sm text-neutral-400 px-2 py-1 bg-white rounded-2xl">10:30</span>
            </div>
            <div class="text-lg flex flex-col gap-2 justify-end items-end">
                <span class="px-5 py-1 bg-green-700 rounded-2xl text-white">Hola! Me interesa el taladro. ¿Está disponible del 8 al 10 de abril?</span>
            </div>
        </div>
        <div class="mt-10 flex flex-row gap-2">
            <input type="text" placeholder="Escribe un mensaje..." class="flex-1 border border-neutral-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-700">
            <button class="bg-green-700 opacity-50 hover:bg-green-700 hover:opacity-100 p-3 rounded-full text-white">
                <fa-icon [icon]="faPaperPlane"></fa-icon>
            </button>
        </div>
    </div>
</div>
